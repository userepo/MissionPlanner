[workspace]
resolver = "2"
members = ["crates/dflog-core", "crates/dflog-ffi", "crates/dflog-cli", "crates/dflog-py"]
# dflog-py (the Python extension module) builds only when asked for
# explicitly (cargo build -p dflog-py, or maturin); the default build and
# test flows stay Python-free
default-members = ["crates/dflog-core", "crates/dflog-ffi", "crates/dflog-cli"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "GPL-3.0"

[profile.release]
lto = true
codegen-units = 1
