[workspace]
resolver = "2"
members = ["crates/dflog-core", "crates/dflog-ffi", "crates/dflog-cli", "crates/dflog-py"]
# dflog-py (the Python extension module) builds only when asked for
# explicitly (cargo build -p dflog-py, or maturin); the default build and
# test flows stay Python-free
default-members = ["crates/dflog-core", "crates/dflog-ffi", "crates/dflog-cli"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "GPL-3.0"

# Every crate opts in with `[lints] workspace = true`. Deliberately absent:
# `clippy::pedantic` (its cast lints fight the bug-for-bug parity casts that
# mirror C# semantics), `clippy::cargo`, and `clippy::unwrap_used` (the
# no-panic guarantee is enforced by the fuzz net and the FFI catch_unwind
# barrier instead; production unwraps are infallible patterns).
[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Unfinished-work and process-exit markers may not ship in production code;
# tests keep panics via clippy.toml.
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
exit = "deny"
unchecked_time_subtraction = "deny"

# Selected `restriction` lints for consistency and brevity
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[profile.release]
lto = true
codegen-units = 1
