[package]
name = "dflog-cli"
version = "0.7.1"
edition.workspace = true
license.workspace = true
description = "ArduPilot dataflash (.bin) log tool: info, dump, convert, parquet export"

[[bin]]
name = "dflog"
path = "src/main.rs"

[dependencies]
dflog-core = { path = "../dflog-core" }
memmap2 = "0.9.11"
# parquet export is opt-in: `cargo build --features parquet` (arrow pulls
# a large dependency tree; the default CLI build stays small)
arrow-array = { version = "59.2.0", optional = true }
arrow-schema = { version = "59.2.0", optional = true }
parquet = { version = "59.2.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[features]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[lints]
workspace = true
