[package]
name = "dflog-py"
version = "0.5.2"
edition.workspace = true
license.workspace = true
description = "Python bindings for dflog-core (ArduPilot dataflash .bin logs)"

[lib]
name = "dflog"
crate-type = ["cdylib"]

[dependencies]
dflog-core = { path = "../dflog-core" }
# abi3-py39: one wheel per platform covers CPython 3.9+;
# generate-import-lib: Windows builds need no Python at compile time
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39", "generate-import-lib"] }
numpy = "0.29.0"
