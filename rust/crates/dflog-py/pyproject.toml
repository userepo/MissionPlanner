[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "dflog"
description = "Fast ArduPilot dataflash (.bin) log reader"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
dynamic = ["version"]

[tool.maturin]
# version comes from Cargo.toml; abi3 wheel per platform
strip = true
